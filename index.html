<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Watericeio</title>
  <!-- Bump ?v= on both lines when style.css or app.js changes. -->
  <link rel="stylesheet" href="style.css?v=2.0">
  <script type="module" src="app.js?v=2.0"></script>
</head>
<body>
  <main>
    <h1>Wate<span class="rice">rice</span>io</h1>
    <p class="tagline">Just right water rice ratio</p>

    <form id="form" novalidate>
      <!-- Reads as a sentence: "270 grams of Jasmine rice". -->
      <div class="sentence">
        <input id="rice" name="rice" type="text" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="0" aria-label="Dry rice in grams">
        <span>grams of</span>
        <span class="select">
          <select id="type" name="type" aria-label="Rice"></select>
        </span>
      </div>

      <!-- Hidden until the first valid amount; app.js reveals it and it then stays. -->
      <section class="results" id="results" aria-live="polite" hidden>
        <div class="result target">
          <span class="result-label">Target weight</span>
          <output id="target" for="rice">–</output>
        </div>
        <div class="result">
          <span class="result-label">Water</span>
          <output id="water" for="rice">–</output>
        </div>
        <div class="result">
          <span class="result-label">Ratio</span>
          <output id="ratio">–</output>
        </div>
      </section>

      <fieldset class="toggle">
        <legend class="visually-hidden">Preference</legend>
        <div class="options" id="preference"></div>
      </fieldset>

      <fieldset class="toggle">
        <legend class="visually-hidden">Method</legend>
        <div class="options" id="method"></div>
      </fieldset>
    </form>
  </main>
</body>
</html>
